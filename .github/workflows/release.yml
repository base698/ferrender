name: Native release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate release tag
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = re.search(r'^version = "([^"]+)"', Path('crates/ferrender/Cargo.toml').read_text(), re.M)[1]
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag) and tag == 'v' + version, 'Run on a matching version tag'
          PY
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify pinned OpenCascade build dependency
        run: |
          python3 scripts/test_prepare_occt.py
          python3 scripts/test_workflow_pins.py
          python3 scripts/prepare-occt.py --github-env
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libx11-dev libxi-dev libxrandr-dev \
            libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers \
            xvfb xauth
      - name: Test engine and non-rendering app boundaries
        run: |
          cargo test --locked --workspace --all-targets -- --skip uitest:: --skip demo::
      - name: Test full Linux UI suite
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_RUNTIME_DIR: ${{ runner.temp }}/ferrender-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a cargo test --locked --workspace --all-targets
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: sh scripts/bundle-macos.sh
      - name: Build Linux app
        if: runner.os == 'Linux'
        run: cargo build --locked --release -p ferrender
      - name: Package and test native build
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/package-release.py --platform "$PACKAGE_PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/Ferrender-*.zip
            dist/Ferrender-*.tar.gz
            dist/Ferrender-*.sha256
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/release
          merge-multiple: true
      - name: Verify all archives and create release
        run: |
          set -euo pipefail
          cd dist/release
          cat ./*.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          test "$(find . -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)" -eq 3
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to replace a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Ferrender ${RELEASE_TAG#v}" --notes-file "../../docs/releases/${RELEASE_TAG#v}.md"
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
